<!DOCTYPE html>
<html lang="zh">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="集装箱装载计算器：算出最省的柜型组合，工人手机扫码一列一列照着装。Container loading planner with a step-by-step guide for workers.">
  <meta name="theme-color" content="#14233A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="装柜计算">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>集装箱装载计算器 Container Loading Calculator</title>
  <link rel="manifest" href="manifest.json">
  <!-- 提前下载程序和中文字体, 与引擎同时进行, 缩短第一次打开的时间 -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/fonts/NotoSansSC-subset.ttf" as="fetch" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #14233A; }
    /* 第一次打开要下载约 4MB, 网络慢时可能要十几秒: 立刻显示载入画面, 不让人对着白屏 */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #14233A, #24405F);
      color: #fff; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      transition: opacity .25s ease; padding: 24px; box-sizing: border-box; text-align: center;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo {
      width: 72px; height: 72px; border-radius: 18px; background: #E8631C;
      display: flex; align-items: center; justify-content: center; animation: pulse 1.6s ease-in-out infinite;
    }
    #splash h1 { font-size: 21px; font-weight: 700; margin: 20px 0 2px; }
    #splash .en { font-size: 12px; letter-spacing: .4px; color: #9FB0C3; }
    #splash .bar { width: 220px; height: 6px; margin-top: 26px; border-radius: 6px; background: rgba(255,255,255,.16); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 6px; background: #E8631C; animation: slide 1.3s ease-in-out infinite; }
    #splash .msg { margin-top: 14px; font-size: 13px; color: #C6D1DD; line-height: 1.6; min-height: 42px; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { #splash .logo, #splash .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9L12 2.8Z"/><path d="M3.5 7.5 12 12.2l8.5-4.7M12 12.2v9"/>
      </svg>
    </div>
    <h1>集装箱装载计算器</h1>
    <div class="en">CONTAINER LOADING CALCULATOR</div>
    <div class="bar"><i></i></div>
    <div class="msg" id="splashMsg">正在载入… Loading…</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash'), msg = document.getElementById('splashMsg');
      var slow = setTimeout(function () { msg.innerHTML = '第一次打开需要多等一下，之后会快很多<br>First visit takes a little longer'; }, 6000);
      var fail = setTimeout(function () { msg.innerHTML = '载入时间过长，请检查网络后重新整理页面<br>Taking too long, check your network and reload'; }, 60000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow); clearTimeout(fail);
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 300);
        // 把这次下载过的档案交给离线快取
        if (navigator.serviceWorker) {
          navigator.serviceWorker.ready.then(function (reg) {
            var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; }).concat([location.href.split('#')[0]]);
            if (reg.active) reg.active.postMessage({ type: 'cache-urls', urls: urls });
          }).catch(function () {});
        }
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
